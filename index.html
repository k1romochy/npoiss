<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НПО ИСС | Интеллектуальные системы сушки</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            width: 100%;
            display: block;
        }

        .contacts {
            padding: 2.5rem 1.5rem 3rem;
            text-align: center;
            background: #111;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .contacts h2 {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 1.25rem;
        }

        .contacts-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        .contacts a {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 400;
            transition: color 0.2s ease;
        }

        .contacts a:hover {
            color: #76B82A;
        }

        .contacts .copy {
            margin-top: 1.75rem;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <picture>
        <source media="(max-width: 768px)" srcset="hero-mobile.jpg">
        <img
            class="hero"
            src="hero.png"
            alt="НПО ИСС — интеллектуальные системы сушки"
        >
    </picture>

    <footer class="contacts">
        <h2>Контакты</h2>
        <div class="contacts-links">
            <a href="tel:+79055055952">+7 905 505 5952</a>
            <a href="mailto:ceo@npoiss.ru">ceo@npoiss.ru</a>
        </div>
        <p class="copy">© 2026 НПО «Интеллектуальные системы сушки»</p>
    </footer>
</body>
</html>
